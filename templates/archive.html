{% extends "base.html" %}
{% block title %}Archive — {{ site.title }}{% endblock %}
{% block content %}
<p class="crumb"><a href="/">..</a></p>
<h1>Archive</h1>
<ul class="post-list">
{% for post in posts %}
<li class="post-item">
  <div class="post-header">
    <a href="/{{ post.slug }}" class="post-title-link">{{ post.title }}</a>
    <time class="post-date" datetime="{{ post.published_at }}">{{ post.published_at_human }}</time>
  </div>
</li>
{% endfor %}
</ul>
{% if not posts %}
<p class="no-posts">Nothing published yet.</p>
{% endif %}
{% endblock %}
