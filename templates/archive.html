{% extends "base.html" %}
{% block title %}Archive — {{ site.title }}{% endblock %}
{% block content %}
<h1>Archive</h1>
<ul class="archive-list">
{% for post in posts %}
<li>
  <time datetime="{{ post.published_at }}">{{ post.published_at_human }}</time>
  <a href="/{{ post.slug }}">{{ post.title }}</a>
</li>
{% endfor %}
</ul>
{% if posts.is_empty() %}
<p>Nothing published yet.</p>
{% endif %}
{% endblock %}
