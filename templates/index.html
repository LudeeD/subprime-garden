{% extends "base.html" %}
{% block content %}
{% for post in posts %}
<article class="post-summary">
  <h2><a href="/{{ post.slug }}">{{ post.title }}</a></h2>
  <time datetime="{{ post.published_at }}">{{ post.published_at_human }}</time>
  <p>{{ post.excerpt }}</p>
</article>
{% endfor %}
{% if posts.is_empty() %}
<p>Nothing published yet.</p>
{% endif %}
{% endblock %}
