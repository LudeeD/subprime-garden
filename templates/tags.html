{% extends "base.html" %}
{% block title %}Tags — {{ site.title }}{% endblock %}
{% block content %}
<p class="crumb"><a href="/">..</a></p>
<h1>Tags</h1>
<ul class="post-list">
{% for tag in tags %}
<li class="post-item">
  <div class="post-header">
    <a href="/tag/{{ tag.slug }}" class="post-title-link">#{{ tag.name }}</a>
    <span class="tag-count">{{ tag.count }}</span>
  </div>
</li>
{% endfor %}
</ul>
{% if not tags %}
<p class="no-posts">No tags yet.</p>
{% endif %}
{% endblock %}
