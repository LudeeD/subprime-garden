# Same as compose.yaml, plus a Caddy sidecar for automatic HTTPS. Copy
# .env.example to .env (in this directory) and point SUBPRIME_DOMAIN at
# your server's DNS — Caddy gets a Let's Encrypt certificate on first boot,
# nothing else to configure.
#
# Run from this directory (deployment/docker) — data/, import/, templates/,
# static/, and garden.toml all live alongside this file:
#   mkdir -p data import templates static && touch garden.toml
#   docker compose -f compose.caddy.yaml run --rm garden init
#   docker compose -f compose.caddy.yaml up -d
services:
  garden:
    image: ghcr.io/ludeed/subprime-garden:latest
    restart: unless-stopped
    expose: ["8080"]
    volumes:
      - ./data:/data
      - ./import:/import:ro
      - ./templates:/templates
      - ./static:/static
      - ./garden.toml:/garden.toml
    environment:
      SUBPRIME_CONFIG: /garden.toml
      SUBPRIME_SERVER__BIND: "0.0.0.0:8080"
      SUBPRIME_SITE__BASE_URL: "https://${SUBPRIME_DOMAIN}"
    healthcheck:
      test: ["CMD", "/subprime-garden", "healthcheck"]
      interval: 30s
      timeout: 3s
      retries: 3

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SUBPRIME_DOMAIN: ${SUBPRIME_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - garden

volumes:
  caddy_data:
  caddy_config:
